name: Sync Kaku Google Calendar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Google Calendar and update website data
        env:
          KAKU_CALENDAR_ICS_URL: ${{ secrets.KAKU_CALENDAR_ICS_URL }}
        run: npm run calendar:sync
      - name: Publish changed calendar data
        run: |
          git config user.name "kaku-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/calendar-events.json
          if git diff --cached --quiet; then
            echo "Calendar is already current."
          else
            git commit -m "Sync Kaku Google Calendar"
            git push
          fi
